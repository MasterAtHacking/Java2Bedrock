name: Move Java2Bedrock to repo root

on:
  workflow_dispatch:

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move folder to home (repo root)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Move unzipped/java2bedrock/java2bedrock -> ./Java2Bedrock
          git mv unzipped/java2bedrock/java2bedrock Java2Bedrock

      - name: Commit and push
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Move Java2Bedrock from unzipped into repo root"
          git push
