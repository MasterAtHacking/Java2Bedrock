name: Unzip content

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip
        run: |
          mkdir -p extracted
          unzip -o data.zip -d extracted

      - name: Show results
        run: ls -R extracted
